# Dremio OSS server configuration.
#
# This file controls server internals only. Data sources (MinIO, Nessie, etc.)
# cannot be declared here — add them via the Dremio UI at http://localhost:9047
# or through the REST API after startup.

paths: {
  local: "/var/lib/dremio"
  dist: "file:///var/lib/dremio/dist"
  spilling: ["/var/lib/dremio/spill"]
}

# Single-node deployment: coordinator and executor run in the same process
services: {
  coordinator.enabled: true
  coordinator.master.enabled: true
  executor.enabled: true
}
