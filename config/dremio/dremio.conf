# Dremio Configuration File
# Reference: https://docs.dremio.com/current/sonar/admin/system-configuration/

# ============================================================================
# Core Configuration
# ============================================================================

# Dremio paths and storage
paths: {
  # Local paths for storing data
  local: "/var/lib/dremio",
  spilling: "/var/lib/dremio/spill",
  downloads: "/var/lib/dremio/downloads",
  scratch: "/var/lib/dremio/scratch",
  uploads: "/var/lib/dremio/uploads",
  results: "/var/lib/dremio/results"
}

# ============================================================================
# Catalog Configuration
# ============================================================================

# Iceberg Catalog Configuration for Dremio
# This allows Dremio to query Iceberg tables through the REST catalog
catalogs: [
  {
    name: "iceberg-nessie",
    type: "iceberg",
    properties: {
      "type": "rest",
      "uri": "http://iceberg-rest:8181",
      "warehouse": "s3://warehouse/",
      "io-impl": "org.apache.iceberg.aws.s3.S3FileIO",
      "s3.endpoint": "http://minio:9000",
      "s3.access-key": "minioadmin",
      "s3.secret-key": "minioadmin123",
      "s3.path-style-access": "true"
    }
  }
]

# ============================================================================
# S3 Source Configuration
# ============================================================================

sources: [
  {
    name: "minio",
    type: "s3",
    properties: {
      "endpoint": "http://minio:9000",
      "access-key": "minioadmin",
      "secret-key": "minioadmin123",
      "path-style-access": "true"
    }
  }
]

# ============================================================================
# Security and Authentication
# ============================================================================

# User impersonation
security: {
  "impersonation": {
    "enabled": false
  }
}

# ============================================================================
# Performance Tuning
# ============================================================================

exec: {
  "rpc": {
    "timeout": "30s"
  },
  "work": {
    "memory": {
      "operator": "500MB"
    }
  }
}
