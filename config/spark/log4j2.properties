# Spark logging (Log4j2) — console + rolling file under /home/spark/logs/

rootLogger.level = warn
rootLogger.appenderRef.console.ref = console
rootLogger.appenderRef.eventLog.ref = eventLog

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

appender.eventLog.type = RollingFile
appender.eventLog.name = eventLog
appender.eventLog.fileName = /home/spark/logs/spark.log
appender.eventLog.filePattern = /home/spark/logs/spark.log.%i
appender.eventLog.layout.type = PatternLayout
appender.eventLog.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n
appender.eventLog.policies.type = Policies
appender.eventLog.policies.size.type = SizeBasedTriggeringPolicy
appender.eventLog.policies.size.size = 100MB
appender.eventLog.strategy.type = DefaultRolloverStrategy
appender.eventLog.strategy.max = 10

# Silence noisy Spark internals (shutdown hooks, metrics system, etc.)
logger.spark.name = org.apache.spark
logger.spark.level = warn
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = warn

# Silence noisy third-party libraries
logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = warn
logger.jettyLifecycle.name = org.sparkproject.jetty.util.component.AbstractLifeCycle
logger.jettyLifecycle.level = error
logger.parquet.name = org.apache.parquet
logger.parquet.level = error
logger.parquet2.name = parquet
logger.parquet2.level = error
logger.hiveMeta.name = org.apache.hadoop.hive.metastore.RetryingHMSHandler
logger.hiveMeta.level = fatal
logger.hiveFunc.name = org.apache.hadoop.hive.ql.exec.FunctionRegistry
logger.hiveFunc.level = error

# Iceberg and Nessie at WARN — INFO floods notebooks with metadata refreshes,
# snapshot scans and partition planning on every table read. Bump to INFO
# locally if you need to debug catalog operations.
logger.iceberg.name = org.apache.iceberg
logger.iceberg.level = warn
logger.nessie.name = org.projectnessie
logger.nessie.level = warn

# S3A doesn't implement Syncable, so every Spark event-log flush logs a WARN
# ("Application invoked the Syncable API ..."). We keep event logs on MinIO on
# purpose (persistent + cross-container) and accept that flushes are no-ops
# until close — the warning is noise.
logger.s3aOutputStream.name = org.apache.hadoop.fs.s3a.S3ABlockOutputStream
logger.s3aOutputStream.level = error
