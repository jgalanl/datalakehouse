# Spark logging — output to console and a rolling file under /home/spark/logs/

log4j.rootCategory=INFO, console, eventLog

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

log4j.appender.eventLog=org.apache.log4j.RollingFileAppender
log4j.appender.eventLog.file=/home/spark/logs/spark.log
log4j.appender.eventLog.layout=org.apache.log4j.PatternLayout
log4j.appender.eventLog.layout.ConversionPattern=%d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n
log4j.appender.eventLog.MaxFileSize=100MB
log4j.appender.eventLog.MaxBackupIndex=10

# Silence noisy third-party libraries
log4j.logger.org.spark_project.jetty=WARN
log4j.logger.org.spark_project.jetty.util.component.AbstractLifeCycle=ERROR
log4j.logger.org.apache.spark.repl.SparkIMain$exprTyper=INFO
log4j.logger.org.apache.spark.repl.SparkILoop$SparkILoopInterpreter=INFO
log4j.logger.org.apache.parquet=ERROR
log4j.logger.parquet=ERROR
log4j.logger.org.apache.hadoop.hive.metastore.RetryingHMSHandler=FATAL
log4j.logger.org.apache.hadoop.hive.ql.exec.FunctionRegistry=ERROR

# Keep Iceberg and Nessie at INFO so catalog operations are visible
log4j.logger.org.apache.iceberg=INFO
log4j.logger.org.projectnessie=INFO
