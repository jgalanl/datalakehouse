# Spark defaults configuration for data lakehouse
# Reference: https://spark.apache.org/docs/latest/configuration.html

# ============================================================================
# Core Spark Configuration
# ============================================================================
spark.master                              spark://spark-master:7077
spark.driver.memory                       1g
spark.executor.memory                     1g
spark.executor.cores                      2
spark.default.parallelism                 4
spark.sql.shuffle.partitions              4
spark.sql.adaptive.enabled                true
spark.sql.adaptive.coalescePartitions.enabled true
spark.sql.adaptive.skewJoin.enabled       true

# ============================================================================
# S3/MinIO Configuration
# ============================================================================
# Note: S3 credentials are passed via environment variables
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are set in docker-compose.yml
# Spark will automatically use these environment variables for S3/MinIO access
spark.hadoop.fs.s3a.endpoint              http://minio:9000
spark.hadoop.fs.s3a.path.style.access     true
spark.hadoop.fs.s3a.impl                  org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3.impl                   org.apache.hadoop.fs.s3a.S3AFileSystem

# ============================================================================
# Iceberg Configuration
# ============================================================================
# Iceberg SQL support
spark.sql.extensions                      org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Default catalog (Nessie)
spark.sql.catalog.nessie                  org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.nessie.catalog-impl     org.apache.iceberg.nessie.NessieCatalog
spark.sql.catalog.nessie.uri              http://nessie-server:19120/api/v2
spark.sql.catalog.nessie.ref              main
spark.sql.catalog.nessie.warehouse        s3a://warehouse/
spark.sql.catalog.nessie.cache.expiration-interval-ms 60000

# Iceberg REST Catalog
spark.sql.catalog.iceberg-rest            org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg-rest.catalog-impl org.apache.iceberg.rest.RESTCatalog
spark.sql.catalog.iceberg-rest.uri        http://iceberg-rest:8181
spark.sql.catalog.iceberg-rest.warehouse  s3a://warehouse/
spark.sql.catalog.iceberg-rest.io-impl    org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg-rest.s3.endpoint http://minio:9000

# ============================================================================
# Logging Configuration
# ============================================================================
spark.eventLog.enabled                    true
spark.eventLog.dir                        /home/spark/logs
spark.history.fs.logDirectory             /home/spark/logs
spark.logConf                             true

# ============================================================================
# Performance Optimization
# ============================================================================
spark.sql.columnar.parquet.enabled        true
spark.sql.columnar.orc.enabled            true
spark.sql.statistics.histogram.enabled    true
spark.sql.statistics.ndv.published        true

# ============================================================================
# Network and Shuffle
# ============================================================================
spark.network.timeout                     120s
spark.executor.heartbeatInterval          60s
spark.shuffle.io.maxRetries               3
spark.shuffle.io.retryWait                5s
