# Ajustes principales
spark.master                                    spark://spark-master:7077
spark.ui.showConsoleProgress                    false
spark.driver.memory                             2500m
spark.executor.memory                           3g
spark.executor.cores                            5
spark.default.parallelism                       10
spark.sql.shuffle.partitions                    20

# Ejecución adaptativa de consultas
spark.sql.adaptive.enabled                      true
spark.sql.adaptive.coalescePartitions.enabled   true
spark.sql.adaptive.skewJoin.enabled             true

# Conexión a MinIO (compatible con S3)
spark.hadoop.fs.s3a.endpoint                    http://minio:9000
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3.impl                         org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled      false
# SimpleAWSCredentialsProvider evita las consultas a los metadatos de EC2 dentro de Docker (latencia añadida + errores confusos); las credenciales vienen de AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY en docker-compose.yml
spark.hadoop.fs.s3a.aws.credentials.provider    org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# Extensiones SQL
# IcebergSparkSessionExtensions — habilita MERGE INTO y otras sentencias DML de Iceberg
# NessieSparkSessionExtensions  — habilita CREATE BRANCH, MERGE BRANCH, SHOW LOG
spark.sql.extensions                            org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.projectnessie.spark.extensions.NessieSparkSessionExtensions

# Catálogo Nessie
spark.sql.catalog.nessie                        org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.nessie.catalog-impl           org.apache.iceberg.nessie.NessieCatalog
spark.sql.catalog.nessie.uri                    http://nessie:19120/api/v1
spark.sql.catalog.nessie.ref                    main
spark.sql.catalog.nessie.authentication.type    NONE
spark.sql.catalog.nessie.warehouse              s3a://warehouse/
spark.sql.catalog.nessie.commit.author          spark
spark.sql.catalog.nessie.cache.expiration-interval-ms  60000

# Configuración de MinIO
spark.sql.catalog.nessie.io-impl               org.apache.iceberg.hadoop.HadoopFileIO

# Los logs de eventos van a MinIO para que persistan entre reinicios y sean accesibles desde cualquier contenedor
spark.eventLog.enabled                          true
spark.eventLog.dir                              s3a://spark-logs/events
spark.logConf                                   true

# Rendimiento
spark.sql.parquet.compression.codec             snappy
spark.sql.statistics.histogram.enabled          true
# Kryo: más rápido/ligero que la serialización de Java para los closures de ML, los broadcasts y el RDD[Vector] que los estimadores de MLlib construyen a partir de los splits cacheados.
spark.serializer                                org.apache.spark.serializer.KryoSerializer

# Red y shuffle
spark.network.timeout                           120s
spark.executor.heartbeatInterval                60s
spark.shuffle.io.maxRetries                     3
spark.shuffle.io.retryWait                      5s

# Aperturas de módulos JDK 11+ — Spark 3.5 sobre JDK 11 (el predeterminado de la imagen
# base apache/spark:3.5.8) necesita estas opciones para silenciar los avisos "Illegal reflective access"
spark.driver.extraJavaOptions                   -XX:+IgnoreUnrecognizedVMOptions --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.nio.charset=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/sun.nio.cs=ALL-UNNAMED --add-opens=java.base/sun.security.action=ALL-UNNAMED --add-opens=java.base/sun.util.calendar=ALL-UNNAMED
spark.executor.extraJavaOptions                 -XX:+IgnoreUnrecognizedVMOptions --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.nio.charset=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/sun.nio.cs=ALL-UNNAMED --add-opens=java.base/sun.security.action=ALL-UNNAMED --add-opens=java.base/sun.util.calendar=ALL-UNNAMED
