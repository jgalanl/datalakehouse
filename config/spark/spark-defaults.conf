# Spark defaults for the data lakehouse platform.
# All Iceberg operations go through the Nessie catalog — there is no second catalog.

# Core settings
spark.master                                    spark://spark-master:7077
# Suppress the in-console stage progress bars — they clutter notebook/spark-submit output
spark.ui.showConsoleProgress                    false
spark.driver.memory                             1500m
spark.executor.memory                           2g
spark.executor.cores                            2
spark.default.parallelism                       4
spark.sql.shuffle.partitions                    4

# Adaptive query execution — lets Spark coalesce partitions and handle skew at runtime
spark.sql.adaptive.enabled                      true
spark.sql.adaptive.coalescePartitions.enabled   true
spark.sql.adaptive.skewJoin.enabled             true

# MinIO (S3-compatible) connection
# Credentials come from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in docker-compose.yml
spark.hadoop.fs.s3a.endpoint                    http://minio:9000
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3.impl                         org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled      false

# Use a simple credential provider to avoid EC2 metadata lookups inside Docker,
# which would add latency and produce confusing errors.
spark.hadoop.fs.s3a.aws.credentials.provider    org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# SQL extensions
# IcebergSparkSessionExtensions — enables MERGE INTO and other Iceberg DML
# NessieSparkSessionExtensions  — enables CREATE BRANCH, MERGE BRANCH, SHOW LOG
spark.sql.extensions                            org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.projectnessie.spark.extensions.NessieSparkSessionExtensions

# Nessie catalog
spark.sql.catalog.nessie                        org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.nessie.catalog-impl           org.apache.iceberg.nessie.NessieCatalog
spark.sql.catalog.nessie.uri                    http://nessie:19120/api/v1
spark.sql.catalog.nessie.ref                    main
spark.sql.catalog.nessie.authentication.type    NONE
spark.sql.catalog.nessie.warehouse              s3a://warehouse/
spark.sql.catalog.nessie.commit.author          spark
spark.sql.catalog.nessie.cache.expiration-interval-ms  60000

# Tell Iceberg how to reach MinIO — uses Hadoop S3A (SDK v1) already on the classpath
spark.sql.catalog.nessie.io-impl               org.apache.iceberg.hadoop.HadoopFileIO

# Event logs go to MinIO so they persist across restarts and are reachable from any container
spark.eventLog.enabled                          true
spark.eventLog.dir                              s3a://spark-logs/events
spark.history.fs.logDirectory                   s3a://spark-logs/events
spark.logConf                                   true

# Performance
spark.sql.parquet.compression.codec             snappy
spark.sql.statistics.histogram.enabled          true

# Network and shuffle
spark.network.timeout                           120s
spark.executor.heartbeatInterval                60s
spark.shuffle.io.maxRetries                     3
spark.shuffle.io.retryWait                      5s
