# Nessie integrated Iceberg REST catalog — object-store (MinIO) access.
# Mounted at /deployments/config/application.properties so Quarkus picks it up.
# Using a properties file (not env vars) because Quarkus env-var mapping is
# unreliable for the nested secret keys below (access-key.name / .secret).
# This is NOT a second catalog: it exposes the same Nessie store over the Iceberg
# REST protocol so read-only clients (OpenMetadata) can list Spark-written tables.

# The nessie.catalog.secrets.* values below are read indirectly by the
# urn:nessie-secret resolver, so SmallRye's strict unknown-property validation
# (which rejects them when delivered via a properties file) must be relaxed.
# Nessie's own 0.106 examples deliver these as CLI args, which bypass this check.
smallrye.config.mapping.validate-unknown=false

nessie.catalog.default-warehouse=warehouse
nessie.catalog.warehouses.warehouse.location=s3://warehouse/

nessie.catalog.service.s3.default-options.region=us-east-1
nessie.catalog.service.s3.default-options.endpoint=http://minio:9000/
nessie.catalog.service.s3.default-options.path-style-access=true
nessie.catalog.service.s3.default-options.auth-type=STATIC

# access-key is a secret reference; the actual credentials live under
# nessie.catalog.secrets and are injected from the container's env (.env values).
nessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
nessie.catalog.secrets.access-key.name=${MINIO_ROOT_USER}
nessie.catalog.secrets.access-key.secret=${MINIO_ROOT_PASSWORD}
