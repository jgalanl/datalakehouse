# Ingesta de OpenMetadata — MODELOS ML mediante MLflow.
# Extrae los modelos registrados (p. ej. fare_prediction + versiones/champion) desde el
# tracking + registry de MLflow hacia OpenMetadata como entidades ML Model.
# __OM_JWT__ lo inyecta en tiempo de ejecución run_ingestion.sh desde .env.
source:
  type: mlflow
  serviceName: mlflow_registry
  serviceConnection:
    config:
      type: Mlflow
      trackingUri: "http://mlflow:5000"
      registryUri: "http://mlflow:5000"
  sourceConfig:
    config:
      type: MlModelMetadata
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: "http://openmetadata:8585/api"
    authProvider: openmetadata
    securityConfig:
      jwtToken: "__OM_JWT__"
