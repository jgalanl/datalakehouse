# Ingesta de OpenMetadata — DATOS del lakehouse mediante el conector nativo de Iceberg,
# apuntando al catálogo Iceberg-REST integrado de Nessie (http://nessie:19120/iceberg).
# Esto preserva la semántica real de las tablas Iceberg (esquemas, columnas) y lee el mismo
# almacén Nessie en el que escribe Spark. OM 1.12.1 OSS no tiene conector de Dremio (solo Collate),
# así que el catálogo Iceberg REST es la vía nativa de OSS para estas tablas.
# Los secretos (__MINIO_KEY__, __MINIO_SECRET__, __OM_JWT__) los inyecta en tiempo de ejecución
# run_ingestion.sh desde .env.
source:
  type: iceberg
  serviceName: iceberg_lakehouse
  serviceConnection:
    config:
      type: Iceberg
      catalog:
        name: nessie
        databaseName: nessie            # nombre lógico de BD que se muestra en OpenMetadata
        connection:
          uri: http://nessie:19120/iceberg          # base Iceberg-REST de Nessie (prefix=main vía /config)
          # catalog.connection de OM es una unión no discriminada [Hive, Rest, ...] y
          # tanto Hive como Rest solo requieren `uri`, así que {uri, fileSystem} por sí solo se resuelve a
          # Hive (→ una llamada colgada al metastore Thrift). Un campo exclusivo de Rest lo desambigua a
          # RestCatalogConnection. El catálogo REST de Nessie no tiene autenticación, así que ignora este
          # token bearer — existe únicamente para seleccionar el tipo de conexión REST.
          token: nessie-no-auth
          fileSystem:
            type:
              awsAccessKeyId: "__MINIO_KEY__"
              awsSecretAccessKey: "__MINIO_SECRET__"
              awsRegion: us-east-1
              endPointURL: http://minio:9000
  sourceConfig:
    config:
      type: DatabaseMetadata
      schemaFilterPattern:
        includes:
          - "nyc"
      markDeletedTables: false
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: "http://openmetadata:8585/api"
    authProvider: openmetadata
    securityConfig:
      jwtToken: "__OM_JWT__"
