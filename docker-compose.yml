services:
  # --- Storage: MinIO (S3) and bucket init ---
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/minio/data
    command: minio server /minio/data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    networks:
      - datalakehouse
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 384M
    labels:
      service: storage
      component: minio

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set datalakehouse http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p datalakehouse/warehouse || true;
      mc mb -p datalakehouse/mlflow-artifacts || true;
      mc mb -p datalakehouse/spark-logs || true;
      echo '' | mc pipe datalakehouse/spark-logs/events/.keep || true;
      mc version enable datalakehouse/mlflow-artifacts || true;
      echo 'MinIO buckets initialized successfully';
      "
    networks:
      - datalakehouse
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    labels:
      service: storage
      component: minio-init

  # --- Catalog: Nessie (Iceberg metadata) ---
  nessie-init:
    image: alpine:3.21
    container_name: nessie-init
    entrypoint: ["sh", "-c", "chown -R 10000:10001 /nessie/data"]
    volumes:
      - nessie_data:/nessie/data
    networks:
      - datalakehouse
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
    labels:
      service: catalog
      component: nessie-init

  nessie:
    image: ghcr.io/projectnessie/nessie:0.106.0
    container_name: nessie
    hostname: nessie
    ports:
      - "19120:19120"
    depends_on:
      nessie-init:
        condition: service_completed_successfully
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_HTTP_PORT: 19120
      QUARKUS_LOG_CONSOLE_FORMAT: "%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{1.}] (%t) %s%e%n"
      QUARKUS_LOG_LEVEL: INFO
      NESSIE_VERSION_STORE_TYPE: ROCKSDB
      NESSIE_VERSION_STORE_PERSIST_ROCKS_DATABASE_PATH: /nessie/data
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - nessie_data:/nessie/data
      - ./config/nessie/application.properties:/deployments/config/application.properties:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v2/config"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - datalakehouse
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 256M
    labels:
      service: catalog
      component: nessie

  # --- Query engine: Dremio OSS ---
  dremio:
    image: dremio/dremio-oss:25.2.0
    container_name: dremio
    hostname: dremio
    profiles: ["ingest", "ml"]
    ports:
      - "9047:9047"
    environment:
      DREMIO_JAVA_SERVER_EXTRA_OPTS: >-
        -Dpaths.dist=file:///var/lib/dremio/dist
        -Dpaths.spilling=[/var/lib/dremio/spill]
        -Xmx1g
        -XX:MaxDirectMemorySize=384m
    volumes:
      - dremio_data:/var/lib/dremio
      - ./config/dremio/dremio.conf:/opt/dremio/conf/dremio.conf:ro
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9047"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - datalakehouse
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          memory: 768M
    labels:
      service: query_engine
      component: dremio

  # --- Compute: Spark (master, notebook and two workers) ---
  spark-master:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
      target: app
    container_name: spark-master
    hostname: spark-master
    profiles: ["ingest", "ml"]
    ports:
      - "8080:8080"
      - "4040:4040"
    environment:
      SPARK_LOCAL_IP: spark-master
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_NO_DAEMONIZE: "true"
      SPARK_CLASSPATH: "/opt/spark/jars/*"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - spark_data:/home/spark
      - ./config/spark/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
      - ./config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./config/spark/hadoop-metrics2.properties:/opt/spark/conf/hadoop-metrics2.properties:ro
      - ./src:/opt/spark/src
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://spark-master:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - datalakehouse
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3584M
        reservations:
          memory: 2G
    labels:
      service: compute
      component: spark-master

  spark-notebook:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
      target: notebook
    container_name: spark-notebook
    hostname: spark-notebook
    profiles: ["ingest", "ml"]
    command: >
      jupyter notebook
        --ip=0.0.0.0
        --port=8888
        --no-browser
        --NotebookApp.token=
        --NotebookApp.password=
        --notebook-dir=/opt/spark/src
    ports:
      - "8888:8888"
      - "4041:4040"
    environment:
      SPARK_CLASSPATH: "/opt/spark/jars/*"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - spark_data:/home/spark
      - ./config/spark/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
      - ./config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./config/spark/hadoop-metrics2.properties:/opt/spark/conf/hadoop-metrics2.properties:ro
      - ./src:/opt/spark/src
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - datalakehouse
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M
    labels:
      service: compute
      component: spark-notebook

  spark-worker-1:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
      target: base
    container_name: spark-worker-1
    hostname: spark-worker-1
    profiles: ["ingest", "ml"]
    command: >
      spark-class org.apache.spark.deploy.worker.Worker
        spark://spark-master:7077
        --webui-port 8081
        --cores 5
        --memory 3072m
    ports:
      - "8081:8081"
    environment:
      SPARK_CLASSPATH: "/opt/spark/jars/*"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - spark_worker_1_data:/home/spark
      - ./config/spark/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
      - ./config/spark/hadoop-metrics2.properties:/opt/spark/conf/hadoop-metrics2.properties:ro
      - ./src:/opt/spark/src:ro
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - datalakehouse
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "5.0"
          memory: 4G
        reservations:
          memory: 2G
    labels:
      service: compute
      component: spark-worker

  spark-worker-2:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
      target: base
    container_name: spark-worker-2
    hostname: spark-worker-2
    profiles: ["ingest", "ml"]
    command: >
      spark-class org.apache.spark.deploy.worker.Worker
        spark://spark-master:7077
        --webui-port 8082
        --cores 5
        --memory 3072m
    ports:
      - "8082:8082"
    environment:
      SPARK_CLASSPATH: "/opt/spark/jars/*"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - spark_worker_2_data:/home/spark
      - ./config/spark/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
      - ./config/spark/hadoop-metrics2.properties:/opt/spark/conf/hadoop-metrics2.properties:ro
      - ./src:/opt/spark/src:ro
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - datalakehouse
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "5.0"
          memory: 4G
        reservations:
          memory: 2G
    labels:
      service: compute
      component: spark-worker

  # --- ML operations: MLflow (postgres, tracking server and model serving) ---
  mlflow-postgres:
    profiles: ["ml", "governance", "api"]
    image: postgres:16-alpine
    container_name: mlflow-postgres
    hostname: mlflow-postgres
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD}
      POSTGRES_DB: ${MLFLOW_DB_NAME}
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'SELECT 1' -q 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - datalakehouse
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    labels:
      service: ml_operations
      component: mlflow-postgres

  mlflow:
    profiles: ["ml", "governance", "api"]
    build:
      context: ./docker/mlflow
      dockerfile: Dockerfile
    container_name: mlflow
    hostname: mlflow
    ports:
      - "5000:5000"
    environment:
      BACKEND_STORE_URI: "postgresql://${MLFLOW_DB_USER}:${MLFLOW_DB_PASSWORD}@mlflow-postgres:5432/${MLFLOW_DB_NAME}"
      DEFAULT_ARTIFACT_ROOT: s3://mlflow-artifacts/
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      mlflow-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - datalakehouse
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    labels:
      service: ml_operations
      component: mlflow

  model-server:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
      target: app
    container_name: model-server
    hostname: model-server
    profiles: ["api"]
    command: >
      mlflow models serve
        -m models:/${SERVE_MODEL:-fare_prediction}@${SERVE_ALIAS:-champion}
        -h 0.0.0.0
        -p 5001
        --env-manager local
    ports:
      - "5001:5001"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      SPARK_CLASSPATH: "/opt/spark/jars/*"
    volumes:
      - ./config/spark/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
      - ./config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./config/spark/hadoop-metrics2.properties:/opt/spark/conf/hadoop-metrics2.properties:ro
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - datalakehouse
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          memory: 1500M
    labels:
      service: ml_operations
      component: model-server

  # --- Governance: OpenMetadata (postgres, elasticsearch, migrate and server) ---
  openmetadata-postgres:
    profiles: ["governance"]
    container_name: openmetadata-postgres
    hostname: openmetadata-postgres
    image: docker.getcollate.io/openmetadata/postgresql:1.12.1
    restart: always
    command:
      - "-c"
      - "work_mem=10MB"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_USER_PASSWORD}
    volumes:
      - openmetadata_postgres_data:/var/lib/postgresql/data
    networks:
      - datalakehouse
    healthcheck:
      test: ["CMD-SHELL", "psql -U $$POSTGRES_USER -d openmetadata_db -c 'SELECT 1' -q 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    labels:
      service: governance
      component: openmetadata-postgres

  openmetadata-elasticsearch:
    profiles: ["governance"]
    container_name: openmetadata-es
    hostname: openmetadata-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - xpack.security.enabled=false
    networks:
      - datalakehouse
    ports:
      - "9200:9200"
    healthcheck:
      test: "curl -s http://localhost:9200/_cluster/health?pretty | grep status | grep -qE 'green|yellow' || exit 1"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - openmetadata_es_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          memory: 1G
    labels:
      service: governance
      component: openmetadata-elasticsearch

  openmetadata-migrate:
    profiles: ["governance"]
    container_name: openmetadata-migrate
    image: docker.getcollate.io/openmetadata/server:1.12.1
    command: "./bootstrap/openmetadata-ops.sh migrate"
    environment:
      MIGRATION_LIMIT_PARAM: ${MIGRATION_LIMIT_PARAM:-1200}
      DB_DRIVER_CLASS: ${DB_DRIVER_CLASS:-org.postgresql.Driver}
      DB_SCHEME: ${DB_SCHEME:-postgresql}
      DB_USER: ${DB_USER}
      DB_USER_PASSWORD: ${DB_USER_PASSWORD}
      DB_HOST: ${DB_HOST:-openmetadata-postgres}
      DB_PORT: ${DB_PORT:-5432}
      OM_DATABASE: ${OM_DATABASE:-openmetadata_db}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-openmetadata-elasticsearch}
      OPENMETADATA_HEAP_OPTS: ${OPENMETADATA_HEAP_OPTS:--Xmx1G -Xms1G}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_KEY_ID: ${JWT_KEY_ID}
      FERNET_KEY: ${FERNET_KEY}
      APPS_RDF_INDEX_APP_ENABLED: "false"
      APPS_CACHE_WARMUP_APP_ENABLED: "false"
      CACHE_SPECS: "maximumSize=100,expireAfterAccess=10m"
    depends_on:
      openmetadata-elasticsearch:
        condition: service_healthy
      openmetadata-postgres:
        condition: service_healthy
    networks:
      - datalakehouse
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          memory: 512M
    labels:
      service: governance
      component: openmetadata-migrate

  openmetadata:
    profiles: ["governance"]
    container_name: openmetadata
    hostname: openmetadata
    restart: always
    image: docker.getcollate.io/openmetadata/server:1.12.1
    environment:
      DB_DRIVER_CLASS: ${DB_DRIVER_CLASS:-org.postgresql.Driver}
      DB_SCHEME: ${DB_SCHEME:-postgresql}
      DB_USER: ${DB_USER}
      DB_USER_PASSWORD: ${DB_USER_PASSWORD}
      DB_HOST: ${DB_HOST:-openmetadata-postgres}
      DB_PORT: ${DB_PORT:-5432}
      OM_DATABASE: ${OM_DATABASE:-openmetadata_db}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-openmetadata-elasticsearch}
      OPENMETADATA_HEAP_OPTS: ${OPENMETADATA_HEAP_OPTS:--Xmx1G -Xms1G}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_KEY_ID: ${JWT_KEY_ID}
      FERNET_KEY: ${FERNET_KEY}
      AUTHORIZER_ADMIN_PRINCIPALS: ${AUTHORIZER_ADMIN_PRINCIPALS:-[admin]}
      AUTHORIZER_PRINCIPAL_DOMAIN: ${AUTHORIZER_PRINCIPAL_DOMAIN:-"open-metadata.org"}
      PIPELINE_SERVICE_CLIENT_ENABLED: ${PIPELINE_SERVICE_CLIENT_ENABLED:-false}
      APPS_RDF_INDEX_APP_ENABLED: "false"
      APPS_CACHE_WARMUP_APP_ENABLED: "false"
      CACHE_SPECS: "maximumSize=100,expireAfterAccess=10m"
    ports:
      - "8585:8585"
    depends_on:
      openmetadata-elasticsearch:
        condition: service_healthy
      openmetadata-postgres:
        condition: service_healthy
      openmetadata-migrate:
        condition: service_completed_successfully
    networks:
      - datalakehouse
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          memory: 1G
    labels:
      service: governance
      component: openmetadata

volumes:
  minio_data:
    driver: local
  nessie_data:
    driver: local
  spark_data:
    driver: local
  spark_worker_1_data:
    driver: local
  spark_worker_2_data:
    driver: local
  dremio_data:
    driver: local
  openmetadata_postgres_data:
    driver: local
  openmetadata_es_data:
    driver: local
  mlflow_postgres_data:
    driver: local

networks:
  datalakehouse:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
