version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: datalakehouse-minio
    ports:
      - "9000:9000"  # MinIO S3 API
      - "9001:9001"  # MinIO Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/minio/data
    command: minio server /minio/data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - datalakehouse

volumes:
  minio_data:
    driver: local

networks:
  datalakehouse:
    driver: bridge
