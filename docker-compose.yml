# Data Lakehouse Platform — local proof-of-concept stack.
#
# Nessie is the only Iceberg catalog. Spark reads and writes tables through it;
# Dremio connects to Nessie as a data source (configured via the Dremio UI).
# Both services work on the same underlying data files.
#
# Estimated steady-state memory: ~13 GB. Allocate at least 16 GB and 6 CPUs
# in Docker Desktop.

services:

  # --- Storage ---

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    hostname: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio-data:/minio/data
    command: minio server /minio/data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    networks:
      - datalakehouse
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    labels:
      service: storage
      component: minio

  # MinIO Initialization: Creates required buckets
  # Medallion layers get one bucket each; auxiliary services get their own buckets.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set datalakehouse http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p datalakehouse/warehouse || true;
      mc mb -p datalakehouse/mlflow-artifacts || true;
      mc mb -p datalakehouse/spark-logs || true;
      echo '' | mc pipe datalakehouse/spark-logs/events/.keep || true;
      mc version enable datalakehouse/mlflow-artifacts || true;
      echo 'MinIO buckets initialized successfully';
      "
    networks:
      - datalakehouse
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    labels:
      service: storage
      component: minio-init

  # --- Catalog ---

  nessie:
    image: ghcr.io/projectnessie/nessie:0.106.0
    container_name: nessie
    hostname: nessie
    ports:
      - "19120:19120"
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_HTTP_PORT: 19120
      QUARKUS_LOG_CONSOLE_FORMAT: "%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{1.}] (%t) %s%e%n"
      QUARKUS_LOG_LEVEL: INFO
      NESSIE_VERSION_STORE_TYPE: ROCKSDB
      NESSIE_VERSION_STORE_PERSIST_ROCKS_DATABASE_PATH: /nessie/data
    volumes:
      - ./nessie-data:/nessie/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v2/config"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - datalakehouse
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 256M
    labels:
      service: catalog
      component: nessie

  # The Iceberg REST catalog was intentionally removed. Two independent catalogs
  # would produce divergent metadata — tables written through one become invisible
  # to the other. Nessie is the single source of truth.

  # --- Compute ---

  spark-master:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8080:8080"   # Master Web UI
      - "7077:7077"   # Master RPC
      - "4040:4040"   # Application UI (driver)
    environment:
      SPARK_LOCAL_IP: spark-master
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_NO_DAEMONIZE: "true"
      SPARK_CLASSPATH: "/opt/spark/jars/*"
      PYTHONPATH: "/opt/spark/src"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - spark_data:/home/spark
      - ./config/spark/log4j.properties:/opt/spark/conf/log4j.properties:ro
      - ./config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./src:/opt/spark/src
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://spark-master:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - datalakehouse
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M
    labels:
      service: compute
      component: spark-master

  # Jupyter notebook — acts as the Spark driver for interactive development
  spark-notebook:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    container_name: spark-notebook
    hostname: spark-notebook
    command: >
      jupyter notebook
        --ip=0.0.0.0
        --port=8888
        --no-browser
        --NotebookApp.token=
        --NotebookApp.password=
        --notebook-dir=/opt/spark/src
    ports:
      - "8888:8888"   # Jupyter UI
      - "4041:4040"   # Application UI (notebook driver)
    environment:
      SPARK_CLASSPATH: "/opt/spark/jars/*"
      PYTHONPATH: "/opt/spark/src"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - spark_data:/home/spark
      - ./config/spark/log4j.properties:/opt/spark/conf/log4j.properties:ro
      - ./config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./src:/opt/spark/src
    depends_on:
      spark-master:
        condition: service_started
    networks:
      - datalakehouse
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M
    labels:
      service: compute
      component: spark-notebook

  spark-worker-1:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    container_name: spark-worker-1
    hostname: spark-worker-1
    # 1536m leaves ~500 MB headroom inside the 2 GB container for JVM overhead
    command: >
      spark-class org.apache.spark.deploy.worker.Worker
        spark://spark-master:7077
        --webui-port 8081
        --cores 2
        --memory 1536m
    ports:
      - "8081:8081"
    environment:
      SPARK_CLASSPATH: "/opt/spark/jars/*"
      PYTHONPATH: "/opt/spark/src"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - spark_worker_1_data:/home/spark
      - ./config/spark/log4j.properties:/opt/spark/conf/log4j.properties:ro
      - ./src:/opt/spark/src:ro
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - datalakehouse
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 1G
    labels:
      service: compute
      component: spark-worker

  # --- Query engine ---

  # Dremio OSS stores its metadata in an embedded RocksDB instance —
  # no external database is needed (that's an Enterprise feature).
  dremio:
    image: dremio/dremio-oss:25.2.0
    container_name: dremio
    hostname: dremio
    ports:
      - "9047:9047"    # Web Console
      - "31010:31010"  # Arrow Flight (JDBC/ODBC)
      - "45678:45678"  # Legacy ODBC
      - "32010:32010"  # REST API
    environment:
      DREMIO_JAVA_SERVER_EXTRA_OPTS: >-
        -Dpaths.dist=file:///var/lib/dremio/dist
        -Dpaths.spilling=[/var/lib/dremio/spill]
        -Xmx1536m
        -XX:MaxDirectMemorySize=1g
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - dremio_data:/var/lib/dremio
      - ./config/dremio/dremio.conf:/opt/dremio/conf/dremio.conf:ro
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9047"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - datalakehouse
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 1G
    labels:
      service: query_engine
      component: dremio

  # --- Governance ---

  # Custom OpenMetadata PostgreSQL image pre-creates the openmetadata_db database
  openmetadata-postgres:
    profiles: ["governance"]
    container_name: openmetadata-postgres
    image: docker.getcollate.io/openmetadata/postgresql:1.12.1
    restart: always
    command:
      - "-c"
      - "work_mem=10MB"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_USER_PASSWORD}
    ports:
      - "5437:5432"   # exposed for debugging; remove if not needed
    volumes:
      - openmetadata_postgres_data:/var/lib/postgresql/data
    networks:
      - datalakehouse
    healthcheck:
      test: ["CMD-SHELL", "psql -U $$POSTGRES_USER -d openmetadata_db -c 'SELECT 1' -q 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    labels:
      service: governance
      component: openmetadata-postgres

  openmetadata-elasticsearch:
    profiles: ["governance"]
    container_name: openmetadata-es
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.4
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - xpack.security.enabled=false
    networks:
      - datalakehouse
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: "curl -s http://localhost:9200/_cluster/health?pretty | grep status | grep -qE 'green|yellow' || exit 1"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - openmetadata_es_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          memory: 1G
    labels:
      service: governance
      component: openmetadata-elasticsearch

  # Runs schema migrations and exits — must complete before the server starts
  openmetadata-migrate:
    profiles: ["governance"]
    container_name: openmetadata-migrate
    image: docker.getcollate.io/openmetadata/server:1.12.1
    command: "./bootstrap/openmetadata-ops.sh migrate"
    environment:
      OPENMETADATA_CLUSTER_NAME: ${OPENMETADATA_CLUSTER_NAME:-openmetadata}
      SERVER_PORT: ${SERVER_PORT:-8585}
      SERVER_ADMIN_PORT: ${SERVER_ADMIN_PORT:-8586}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MIGRATION_LIMIT_PARAM: ${MIGRATION_LIMIT_PARAM:-1200}
      AUTHORIZER_CLASS_NAME: ${AUTHORIZER_CLASS_NAME:-org.openmetadata.service.security.DefaultAuthorizer}
      AUTHORIZER_REQUEST_FILTER: ${AUTHORIZER_REQUEST_FILTER:-org.openmetadata.service.security.JwtFilter}
      AUTHORIZER_ADMIN_PRINCIPALS: ${AUTHORIZER_ADMIN_PRINCIPALS:-[admin]}
      AUTHORIZER_ALLOWED_REGISTRATION_DOMAIN: ${AUTHORIZER_ALLOWED_REGISTRATION_DOMAIN:-["all"]}
      AUTHORIZER_INGESTION_PRINCIPALS: ${AUTHORIZER_INGESTION_PRINCIPALS:-[ingestion-bot]}
      AUTHORIZER_PRINCIPAL_DOMAIN: ${AUTHORIZER_PRINCIPAL_DOMAIN:-"open-metadata.org"}
      AUTHORIZER_ENFORCE_PRINCIPAL_DOMAIN: ${AUTHORIZER_ENFORCE_PRINCIPAL_DOMAIN:-false}
      AUTHENTICATION_PROVIDER: ${AUTHENTICATION_PROVIDER:-basic}
      AUTHENTICATION_ENABLE_SELF_SIGNUP: ${AUTHENTICATION_ENABLE_SELF_SIGNUP:-true}
      DB_DRIVER_CLASS: ${DB_DRIVER_CLASS:-org.postgresql.Driver}
      DB_SCHEME: ${DB_SCHEME:-postgresql}
      DB_PARAMS: ${DB_PARAMS:-allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
      DB_USER: ${DB_USER}
      DB_USER_PASSWORD: ${DB_USER_PASSWORD}
      DB_HOST: ${DB_HOST:-openmetadata-postgres}
      DB_PORT: ${DB_PORT:-5432}
      OM_DATABASE: ${OM_DATABASE:-openmetadata_db}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-openmetadata-elasticsearch}
      ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT:-9200}
      ELASTICSEARCH_SCHEME: ${ELASTICSEARCH_SCHEME:-http}
      SEARCH_TYPE: ${SEARCH_TYPE:-elasticsearch}
      OPENMETADATA_HEAP_OPTS: ${OPENMETADATA_HEAP_OPTS:--Xmx1G -Xms1G}
      RSA_PUBLIC_KEY_FILE_PATH: ${RSA_PUBLIC_KEY_FILE_PATH:-"./conf/public_key.der"}
      RSA_PRIVATE_KEY_FILE_PATH: ${RSA_PRIVATE_KEY_FILE_PATH:-"./conf/private_key.der"}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_KEY_ID: ${JWT_KEY_ID}
      SECRET_MANAGER: ${SECRET_MANAGER:-db}
      FERNET_KEY: ${FERNET_KEY}
      APPS_RDF_INDEX_APP_ENABLED: "false"
      APPS_CACHE_WARMUP_APP_ENABLED: "false"
      CACHE_SPECS: "maximumSize=100,expireAfterAccess=10m"
    depends_on:
      openmetadata-elasticsearch:
        condition: service_healthy
      openmetadata-postgres:
        condition: service_healthy
    networks:
      - datalakehouse
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          memory: 512M
    labels:
      service: governance
      component: openmetadata-migrate

  openmetadata:
    profiles: ["governance"]
    container_name: openmetadata
    restart: always
    image: docker.getcollate.io/openmetadata/server:1.12.1
    environment:
      OPENMETADATA_CLUSTER_NAME: ${OPENMETADATA_CLUSTER_NAME:-openmetadata}
      SERVER_PORT: ${SERVER_PORT:-8585}
      SERVER_ADMIN_PORT: ${SERVER_ADMIN_PORT:-8586}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTHORIZER_CLASS_NAME: ${AUTHORIZER_CLASS_NAME:-org.openmetadata.service.security.DefaultAuthorizer}
      AUTHORIZER_REQUEST_FILTER: ${AUTHORIZER_REQUEST_FILTER:-org.openmetadata.service.security.JwtFilter}
      AUTHORIZER_ADMIN_PRINCIPALS: ${AUTHORIZER_ADMIN_PRINCIPALS:-[admin]}
      AUTHORIZER_ALLOWED_REGISTRATION_DOMAIN: ${AUTHORIZER_ALLOWED_REGISTRATION_DOMAIN:-["all"]}
      AUTHORIZER_INGESTION_PRINCIPALS: ${AUTHORIZER_INGESTION_PRINCIPALS:-[ingestion-bot]}
      AUTHORIZER_PRINCIPAL_DOMAIN: ${AUTHORIZER_PRINCIPAL_DOMAIN:-"open-metadata.org"}
      AUTHORIZER_ENFORCE_PRINCIPAL_DOMAIN: ${AUTHORIZER_ENFORCE_PRINCIPAL_DOMAIN:-false}
      AUTHENTICATION_PROVIDER: ${AUTHENTICATION_PROVIDER:-basic}
      AUTHENTICATION_ENABLE_SELF_SIGNUP: ${AUTHENTICATION_ENABLE_SELF_SIGNUP:-true}
      DB_DRIVER_CLASS: ${DB_DRIVER_CLASS:-org.postgresql.Driver}
      DB_SCHEME: ${DB_SCHEME:-postgresql}
      DB_PARAMS: ${DB_PARAMS:-allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
      DB_USER: ${DB_USER}
      DB_USER_PASSWORD: ${DB_USER_PASSWORD}
      DB_HOST: ${DB_HOST:-openmetadata-postgres}
      DB_PORT: ${DB_PORT:-5432}
      OM_DATABASE: ${OM_DATABASE:-openmetadata_db}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-openmetadata-elasticsearch}
      ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT:-9200}
      ELASTICSEARCH_SCHEME: ${ELASTICSEARCH_SCHEME:-http}
      SEARCH_TYPE: ${SEARCH_TYPE:-elasticsearch}
      OPENMETADATA_HEAP_OPTS: ${OPENMETADATA_HEAP_OPTS:--Xmx1G -Xms1G}
      RSA_PUBLIC_KEY_FILE_PATH: ${RSA_PUBLIC_KEY_FILE_PATH:-"./conf/public_key.der"}
      RSA_PRIVATE_KEY_FILE_PATH: ${RSA_PRIVATE_KEY_FILE_PATH:-"./conf/private_key.der"}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_KEY_ID: ${JWT_KEY_ID}
      PIPELINE_SERVICE_CLIENT_ENDPOINT: ${PIPELINE_SERVICE_CLIENT_ENDPOINT:-http://ingestion:8080}
      PIPELINE_SERVICE_CLIENT_HEALTH_CHECK_INTERVAL: ${PIPELINE_SERVICE_CLIENT_HEALTH_CHECK_INTERVAL:-300}
      SERVER_HOST_API_URL: ${SERVER_HOST_API_URL:-http://openmetadata:8585/api}
      PIPELINE_SERVICE_CLIENT_VERIFY_SSL: ${PIPELINE_SERVICE_CLIENT_VERIFY_SSL:-"no-ssl"}
      PIPELINE_SERVICE_CLIENT_ENABLED: ${PIPELINE_SERVICE_CLIENT_ENABLED:-false}
      SECRET_MANAGER: ${SECRET_MANAGER:-db}
      FERNET_KEY: ${FERNET_KEY}
      MASK_PASSWORDS_API: ${MASK_PASSWORDS_API:-false}
      WEB_CONF_URI_PATH: ${WEB_CONF_URI_PATH:-"/api"}
      APPS_RDF_INDEX_APP_ENABLED: "false"
      APPS_CACHE_WARMUP_APP_ENABLED: "false"
      CACHE_SPECS: "maximumSize=100,expireAfterAccess=10m"
    ports:
      - "8585:8585"
      - "8586:8586"
    depends_on:
      openmetadata-elasticsearch:
        condition: service_healthy
      openmetadata-postgres:
        condition: service_healthy
      openmetadata-migrate:
        condition: service_completed_successfully
    networks:
      - datalakehouse
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          memory: 1G
    labels:
      service: governance
      component: openmetadata

  # --- ML operations ---

  mlflow-postgres:
    profiles: ["ml"]
    image: postgres:16-alpine
    container_name: mlflow-postgres
    hostname: mlflow-postgres
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD}
      POSTGRES_DB: ${MLFLOW_DB_NAME}
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"   # exposed for debugging; remove if not needed
    healthcheck:
      test: ["CMD-SHELL", "psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'SELECT 1' -q 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - datalakehouse
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    labels:
      service: ml_operations
      component: mlflow-postgres

  mlflow:
    profiles: ["ml"]
    build:
      context: ./docker/mlflow
      dockerfile: Dockerfile
    container_name: mlflow
    hostname: mlflow
    ports:
      - "5000:5000"
    environment:
      BACKEND_STORE_URI: "postgresql://${MLFLOW_DB_USER}:${MLFLOW_DB_PASSWORD}@mlflow-postgres:5432/${MLFLOW_DB_NAME}"
      DEFAULT_ARTIFACT_ROOT: s3://mlflow-artifacts/
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      mlflow-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - datalakehouse
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    labels:
      service: ml_operations
      component: mlflow

volumes:
  spark_data:
    driver: local
  spark_worker_1_data:
    driver: local
  dremio_data:      # Dremio uses embedded RocksDB, so no separate postgres volume needed
    driver: local
  openmetadata_postgres_data:
    driver: local
  openmetadata_es_data:
    driver: local
  mlflow_postgres_data:
    driver: local

networks:
  datalakehouse:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
